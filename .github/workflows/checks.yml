name: Portfolio checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            notebook/package-lock.json
      - run: |
          npm ci
          npm ci --prefix notebook
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
